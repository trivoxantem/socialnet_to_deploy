{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white shadow-md rounded-lg p-8 w-full max-w-sm">

        <h2 class="text-2xl font-semibold text-center text-blue-600 mb-6">Login to Your Account</h2>

        {% for message in messages %}
            <div class="text-sm text-red-500 mb-2 text-center">{{ message }}</div>
        {% endfor %}

        <form action="" method="post" class="space-y-4">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username"
                   class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400">

            <input type="password" name="password" placeholder="Password"
                   class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400">

            <input type="submit" value="Login"
                   class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2 rounded cursor-pointer transition duration-200">
        </form>

        <p class="text-center text-sm text-gray-600 mt-4">
            Don’t have an account?
            <a href="{% url 'signup' %}" class="text-blue-500 hover:underline">Sign up</a>
        </p>

    </div>

</body>
</html>
