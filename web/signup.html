{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm">
        <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">Sign Up</h2>

        {% for message in messages %}
            <div class="text-red-500 text-sm text-center mb-2">{{ message }}</div>
        {% endfor %}

        <form action="" method="post" class="space-y-4">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username"
                class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400">

            <input type="email" name="email" placeholder="Email"
                class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400">

            <input type="password" name="password" placeholder="Password"
                class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400">

            <input type="password" name="password2" placeholder="Retype Password"
                class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400">

            <input type="submit" value="Sign Up"
                class="w-full bg-blue-500 text-white font-semibold py-2 rounded hover:bg-blue-600 cursor-pointer transition duration-200">
        </form>

        <p class="text-center text-sm text-gray-600 mt-4">
            Already have an account?
            <a href="{% url 'login' %}" class="text-blue-500 hover:underline">Log in</a>
        </p>
    </div>

</body>
</html>
